spring:
  data:
    mongodb:
      uri: mongodb://localhost:27017/ehealthcare_test
    redis:
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers: localhost:9092

eureka:
  client:
    enabled: false

jwt:
  secret: test-secret-key-for-testing-only
  expiration: 3600000  # 1 hour for tests

logging:
  level:
    com.ehealth: DEBUG
    org.springframework.test: DEBUG
